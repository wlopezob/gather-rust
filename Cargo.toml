[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = {level = "warn", priority = -1}

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"]}
serde_json = "1.0.154"
thiserror = "2.0.21"
